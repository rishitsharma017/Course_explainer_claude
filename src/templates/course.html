{% extends 'layout.html' %}

{% block title %}{{ course.title }}{% endblock %}

{% block content %}
<div class="breadcrumb">
  <a href="{{ url_for('index') }}">← Back to Courses</a>
</div>

<div class="course-detail">
  <h1 class="course-detail-title">{{ course.title }}</h1>
  <p class="course-detail-desc">{{ course.description }}</p>

  <div class="course-detail-meta">
    <div class="meta-card">
      <span class="meta-label">Instructor</span>
      <span class="meta-value">{{ course.instructor }}</span>
    </div>
    <div class="meta-card">
      <span class="meta-label">Duration</span>
      <span class="meta-value">{{ course.duration }}</span>
    </div>
  </div>

  <a href="{{ url_for('index') }}" class="btn-secondary">Browse All Courses</a>
</div>
{% endblock %}
